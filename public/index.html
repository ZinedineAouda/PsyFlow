<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RFID Patient Manager</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<header class="header">
  <h1><span class="icon">&#x1F4CB;</span> RFID Patient Manager</h1>
  <div class="mode-tabs">
    <button class="mode-tab active" data-mode="reading" onclick="switchMode('reading')">Reading Mode</button>
    <button class="mode-tab" data-mode="register" onclick="switchMode('register')">Registration</button>
    <button class="mode-tab" data-mode="manage" onclick="switchMode('manage')">Manage</button>
  </div>
</header>

<main class="main-content">
  <div id="alert-container"></div>

  <!-- READING MODE -->
  <section id="mode-reading">
    <div class="rfid-scan-section">
      <h2>Scan Patient Card</h2>
      <p>Place the RFID card on the reader, or type the card UID manually</p>
      <div class="rfid-input-group">
        <input type="text" id="read-rfid-input" class="rfid-input" placeholder="RFID UID..." autofocus>
        <button class="btn btn-primary btn-lg" onclick="scanCard()">Scan</button>
      </div>
    </div>
    <div id="read-result" class="hidden"></div>
  </section>

  <!-- REGISTRATION MODE -->
  <section id="mode-register" class="hidden">
    <div class="rfid-scan-section">
      <h2>Register New Patient Card</h2>
      <p>Scan the new RFID card, then fill in patient details</p>
      <div class="rfid-input-group">
        <input type="text" id="reg-rfid-input" class="rfid-input" placeholder="RFID UID...">
        <button class="btn btn-primary" onclick="checkCardForRegistration()">Check Card</button>
      </div>
    </div>
    <div id="reg-form-container" class="hidden">
      <div class="card">
        <h3 class="section-title">Patient Information</h3>
        <form id="registration-form" onsubmit="registerPatient(event)">
          <input type="hidden" id="reg-rfid-uid">
          <div class="form-group">
            <label for="reg-name">Full Name *</label>
            <input type="text" id="reg-name" required placeholder="Enter patient full name">
          </div>
          <div class="form-row">
            <div class="form-group">
              <label for="reg-age">Age</label>
              <input type="number" id="reg-age" min="0" max="150" placeholder="Age">
            </div>
            <div class="form-group">
              <label for="reg-gender">Gender</label>
              <select id="reg-gender">
                <option value="">-- Select --</option>
                <option value="Male">Male</option>
                <option value="Female">Female</option>
                <option value="Other">Other</option>
              </select>
            </div>
          </div>
          <div class="form-group">
            <label for="reg-diagnosis">Diagnosis</label>
            <input type="text" id="reg-diagnosis" placeholder="Primary diagnosis">
          </div>
          <div class="form-group">
            <label for="reg-notes">Notes</label>
            <textarea id="reg-notes" placeholder="Additional notes, observations..."></textarea>
          </div>
          <div class="custom-fields-section">
            <h3 class="section-title">Custom Fields <button type="button" class="btn btn-outline btn-sm" onclick="addCustomField('reg')">+ Add Field</button></h3>
            <div id="reg-custom-fields"></div>
          </div>
          <div class="actions-bar">
            <button type="button" class="btn btn-outline" onclick="cancelRegistration()">Cancel</button>
            <button type="submit" class="btn btn-success btn-lg">Register Patient</button>
          </div>
        </form>
      </div>
    </div>
  </section>

  <!-- MANAGE MODE -->
  <section id="mode-manage" class="hidden">
    <div class="card">
      <h3 class="section-title">All Patients</h3>
      <div class="search-bar">
        <input type="text" id="search-input" placeholder="Search by name, RFID, or diagnosis..." oninput="debounceSearch()">
        <button class="btn btn-primary" onclick="loadPatients()">Refresh</button>
      </div>
      <div id="patient-list-container"></div>
    </div>
  </section>
</main>

<!-- EDIT MODAL -->
<div class="modal-overlay" id="edit-modal">
  <div class="modal">
    <h3 class="section-title">Edit Patient</h3>
    <form id="edit-form" onsubmit="saveEdit(event)">
      <input type="hidden" id="edit-id">
      <div class="form-group">
        <label for="edit-name">Full Name *</label>
        <input type="text" id="edit-name" required>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label for="edit-age">Age</label>
          <input type="number" id="edit-age" min="0" max="150">
        </div>
        <div class="form-group">
          <label for="edit-gender">Gender</label>
          <select id="edit-gender">
            <option value="">-- Select --</option>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
            <option value="Other">Other</option>
          </select>
        </div>
      </div>
      <div class="form-group">
        <label for="edit-diagnosis">Diagnosis</label>
        <input type="text" id="edit-diagnosis">
      </div>
      <div class="form-group">
        <label for="edit-notes">Notes</label>
        <textarea id="edit-notes"></textarea>
      </div>
      <div class="custom-fields-section">
        <h3 class="section-title">Custom Fields <button type="button" class="btn btn-outline btn-sm" onclick="addCustomField('edit')">+ Add Field</button></h3>
        <div id="edit-custom-fields"></div>
      </div>
      <div class="actions-bar">
        <button type="button" class="btn btn-outline" onclick="closeEditModal()">Cancel</button>
        <button type="submit" class="btn btn-success">Save Changes</button>
      </div>
    </form>
  </div>
</div>

<!-- CONFIRM MODAL -->
<div class="modal-overlay" id="confirm-modal">
  <div class="modal">
    <h3 id="confirm-title">Confirm Action</h3>
    <p id="confirm-message" style="margin: 16px 0; color: var(--text-muted);"></p>
    <div class="actions-bar">
      <button class="btn btn-outline" onclick="closeConfirmModal()">Cancel</button>
      <button class="btn btn-danger" id="confirm-btn" onclick="confirmAction()">Confirm</button>
    </div>
  </div>
</div>

<script src="/js/app.js"></script>
</body>
</html>
